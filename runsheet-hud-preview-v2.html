<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Runsheet HUD — Preview</title>
<style>
:root{
  --bg:#0B0D10;
  --panel:rgba(255,255,255,0.035);
  --panel-line:rgba(255,255,255,0.08);
  --hi:#C6FF3D;       /* hi-vis accent, matches courier gear */
  --hi-dim:rgba(198,255,61,0.15);
  --teal:#3DE0C8;
  --coral:#FF6B5C;
  --text:#F2F4F0;
  --text-dim:#7C8389;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(198,255,61,0.06), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
}
#app{min-height:100dvh; display:flex; flex-direction:column; max-width:480px; margin:0 auto; padding:16px; overflow-y:auto;}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 18px;}
.wordmark{font-size:13px; font-weight:700; letter-spacing:.14em; color:var(--text-dim);}
.wordmark b{color:var(--hi);}
.clock{font-variant-numeric:tabular-nums; font-size:13px; color:var(--text-dim); letter-spacing:.04em;}

/* ring + counter */
.ring-wrap{position:relative; width:172px; height:172px; margin:6px auto 18px;}
.ring-wrap svg{width:100%;height:100%; transform:rotate(-90deg);}
.ring-track{fill:none; stroke:rgba(255,255,255,0.06); stroke-width:8;}
.ring-fill{fill:none; stroke:var(--hi); stroke-width:8; stroke-linecap:round; filter:drop-shadow(0 0 6px rgba(198,255,61,0.55)); transition:stroke-dashoffset .5s ease;}
.ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-num{font-size:46px; font-weight:700; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.ring-sub{font-size:11px; color:var(--text-dim); letter-spacing:.12em; margin-top:4px; text-transform:uppercase;}

/* stop card */
.stop-card{
  flex:1; display:flex; flex-direction:column; justify-content:center;
  background:var(--panel); border:1px solid var(--panel-line); border-radius:18px;
  padding:22px 20px; position:relative; overflow:hidden;
}
.stop-eyebrow{font-size:11px; color:var(--hi); letter-spacing:.14em; text-transform:uppercase; font-weight:700; margin-bottom:8px;}
.stop-name{font-size:24px; font-weight:700; line-height:1.25; letter-spacing:-.01em;}
.stop-notes{font-size:13px; color:var(--text-dim); margin-top:6px;}

.chips{display:flex; gap:8px; margin-top:16px;}
.chip{
  background:rgba(255,255,255,0.05); border:1px solid var(--panel-line); border-radius:8px;
  padding:7px 11px; font-size:12.5px; color:var(--text-dim); font-variant-numeric:tabular-nums;
}
.chip b{color:var(--text); font-weight:600;}

/* actions */
.actions{display:flex; gap:10px; margin-top:22px;}
.btn{
  flex:1; border:none; border-radius:14px; padding:18px 10px; font-size:15px; font-weight:700;
  display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
  letter-spacing:.01em;
}
.btn .icon{font-size:20px;}
.btn-nav{background:var(--hi); color:#101410; box-shadow:0 0 22px rgba(198,255,61,0.25);}
.btn-done{background:var(--teal); color:#07211c;}
.skip-link{
  text-align:center; margin-top:14px; font-size:12.5px; color:var(--text-dim);
  text-decoration:underline; background:none; border:none; width:100%; padding:6px;
}

/* mascot */
.mascot-wrap{display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 4px 4px; min-height:150px;}
.mascot-msg{font-size:15px; font-weight:700; opacity:0; transition:opacity .25s ease; min-height:20px; text-align:center;}
.mascot-char{position:relative; overflow:visible;}
.mascot-body{transform-origin:60px 70px;}
.mascot-body.idle{animation:idleBob 2.6s ease-in-out infinite;}
.mascot-body.happy{animation:happyHop .5s ease-out 2;}
.mascot-body.sad{animation:sadShake .6s ease-out;}
@keyframes idleBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
@keyframes happyHop{0%{transform:translateY(0) rotate(0);}35%{transform:translateY(-14px) rotate(-4deg);}60%{transform:translateY(0) rotate(3deg);}100%{transform:translateY(0) rotate(0);}}
@keyframes sadShake{0%,100%{transform:translateX(0) translateY(0);}20%{transform:translateX(-3px) translateY(3px);}40%{transform:translateX(3px) translateY(4px);}60%{transform:translateX(-2px) translateY(4px);}80%{transform:translateX(2px) translateY(2px);}}
.mascot-msg.show{opacity:1;}
.mascot-msg.happy-text{color:var(--hi);}
.mascot-msg.sad-text{color:var(--coral);}
.nameplate{
  text-align:center; font-size:10px; font-weight:700; color:var(--hi);
  letter-spacing:.06em; text-shadow:0 1px 2px rgba(0,0,0,0.8); margin-bottom:2px;
}
.nameplate .hp-bar{
  width:44px; height:4px; background:#3a1414; border-radius:2px; margin:2px auto 0;
  overflow:hidden; border:1px solid rgba(0,0,0,0.4);
}
.nameplate .hp-fill{height:100%; background:var(--hi); transition:width .4s ease;}
.spark{position:absolute; pointer-events:none; font-size:13px; opacity:0; animation:sparkUp .7s ease-out forwards;}
@keyframes sparkUp{0%{opacity:1; transform:translate(0,0) scale(0.6);}100%{opacity:0; transform:translate(var(--dx),-34px) scale(1.1);}}

.scythe{transform-origin:85px 62px;}
.scythe.swing{animation:scytheSwing .45s ease-out;}
@keyframes scytheSwing{0%{transform:rotate(0deg);}40%{transform:rotate(-75deg);}70%{transform:rotate(12deg);}100%{transform:rotate(0deg);}}

.enemy{transform-origin:114px 56px;}
.enemy.hit{animation:enemyHit .4s ease-out;}
@keyframes enemyHit{0%{transform:translate(0,0) rotate(0);}30%{transform:translate(5px,-2px) rotate(8deg);}60%{transform:translate(-3px,1px) rotate(-5deg);}100%{transform:translate(0,0) rotate(0);}}

.dmg-num{
  position:absolute; font-weight:800; font-size:16px; color:#FF3B3B;
  text-shadow:0 1px 3px rgba(0,0,0,0.85); pointer-events:none; opacity:0;
  animation:dmgFloat .8s ease-out forwards;
}
@keyframes dmgFloat{0%{opacity:1; transform:translateY(0) scale(0.7);}20%{transform:translateY(-6px) scale(1.2);}100%{opacity:0; transform:translateY(-32px) scale(1);}}

/* up next strip */
.upnext{margin-top:16px;}
.upnext-head{display:flex; justify-content:space-between; align-items:center; padding:0 2px 8px;}
.upnext-head span{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em;}
.upnext-list{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
.upnext-item{
  flex-shrink:0; background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
  padding:8px 12px; font-size:12px; color:var(--text-dim); white-space:nowrap;
}
.upnext-item b{color:var(--text); font-weight:600; display:block; font-size:12.5px;}

.done-screen{display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
.done-screen .big{font-size:22px; font-weight:700;}
.done-screen .sub{color:var(--text-dim); font-size:13px; margin-top:6px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="wordmark">RUN<b>—</b>SHEET</div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="ring-wrap">
    <svg viewBox="0 0 100 100">
      <circle class="ring-track" cx="50" cy="50" r="44"></circle>
      <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="276.5"></circle>
    </svg>
    <div class="ring-center">
      <div class="ring-num" id="ringNum">1</div>
      <div class="ring-sub" id="ringSub">of 6</div>
    </div>
  </div>

  <div class="stop-card" id="stopCard">
    <div class="stop-eyebrow" id="stopEyebrow">NEXT STOP</div>
    <div class="stop-name" id="stopName">—</div>
    <div class="stop-notes" id="stopNotes"></div>
    <div class="chips">
      <div class="chip">📍 <b id="chipDist">—</b></div>
      <div class="chip">⏱ <b id="chipEta">—</b></div>
    </div>
    <div class="actions">
      <button class="btn btn-nav" id="navBtn"><span class="icon">↗</span>Navigate</button>
      <button class="btn btn-done" id="doneBtn"><span class="icon">✓</span>Done</button>
    </div>
    <button class="skip-link" id="skipBtn">Skip for now</button>
  </div>

  <div class="done-screen" id="doneScreen">
    <div class="big">🏁 Route complete</div>
    <div class="sub">All stops delivered. Nice work.</div>
  </div>

  <div class="mascot-wrap" id="mascotWrap" style="position:relative;">
    <div class="nameplate">RUNSHEET <span id="mascotLevel">lv-1</span>
      <div class="hp-bar"><div class="hp-fill" id="mascotHpFill" style="width:100%;"></div></div>
    </div>
    <div class="mascot-msg" id="mascotMsg"></div>
    <div class="mascot-char" id="mascotCharWrap">
      <svg class="mascot-svg" viewBox="0 0 130 90" width="117" height="81">
      <g class="mascot-body idle" id="mascotBody">
        <ellipse cx="60" cy="76" rx="26" ry="4" fill="rgba(0,0,0,0.35)"></ellipse>
        <!-- apron/dress -->
        <path d="M42 40 L36 72 L84 72 L78 40 Q60 34 42 40 Z" fill="var(--hi)" stroke="rgba(0,0,0,0.15)"></path>
        <path d="M60 34 L78 40 L84 72 L60 72 Z" fill="#000" opacity="0.38"></path>
        <!-- vest overlay -->
        <path d="M48 38 L44 52 L76 52 L72 38 Q60 33 48 38 Z" fill="#3E4A3A"></path>
        <path d="M60 33 L72 38 L76 52 L60 52 Z" fill="#000" opacity="0.4"></path>
        <!-- belt -->
        <rect x="42" y="51" width="36" height="6" rx="2" fill="#6B4226"></rect>
        <rect x="56" y="51" width="8" height="6" rx="1.5" fill="#8a5a34"></rect>
        <!-- sleeves -->
        <rect x="30" y="42" width="10" height="16" rx="4" fill="#2E332F"></rect>
        <rect x="80" y="42" width="10" height="16" rx="4" fill="#2E332F"></rect>
        <circle cx="35" cy="60" r="4.5" fill="#E8B692"></circle>
        <circle cx="85" cy="60" r="4.5" fill="#E8B692"></circle>
        <rect x="55" y="33" width="10" height="9" fill="#E8B692"></rect>
        <!-- head -->
        <circle cx="60" cy="24" r="16" fill="#E8B692"></circle>
        <path d="M60 8 A16 16 0 0 1 60 40 Z" fill="#000" opacity="0.35"></path>
        <!-- ginger hair -->
        <path d="M42 22 Q40 7 60 6.5 Q80 7 78 22 L78 34 Q74 25 70 34 L70 25 Q60 29 50 25 L50 34 Q46 25 42 34 Z" fill="#B5591F"></path>
        <path d="M60 6.5 Q80 7 78 22 L78 34 Q74 25 70 34 L70 25 Q60 29 60 27 Z" fill="#000" opacity="0.4"></path>
        <path d="M48 13 Q60 9 72 13 L70 17 Q60 14 50 17 Z" fill="#B5591F"></path>
        <!-- cap -->
        <path d="M43 12 Q60 -2 77 12 L74 17 Q60 8 46 17 Z" fill="#3E4A3A" stroke="#2A332C" stroke-width="0.5"></path>
        <path d="M60 -2 Q77 12 74 17 L60 8 Z" fill="#000" opacity="0.42"></path>
        <!-- eyepatch -->
        <path d="M60 20 L69 19 L69 27 L60 26 Z" fill="#1A1A1A"></path>
        <rect x="59" y="20" width="12" height="2" fill="#1A1A1A" transform="rotate(-4 59 20)"></rect>
        <!-- visible eye -->
        <circle cx="54" cy="24" r="2.2" fill="#2A2A2A"></circle>
        <path id="mascotMouth" d="M53 31 Q60 35 67 31" stroke="#8a4a3a" stroke-width="2" fill="none" stroke-linecap="round"></path>
      </g>
      <g class="scythe" id="scytheGroup">
        <line x1="85" y1="62" x2="98" y2="16" stroke="#4A4A4A" stroke-width="3" stroke-linecap="round"></line>
        <path d="M98 16 Q118 8 110 30 Q101 27 98 16 Z" fill="#B9C2C8" stroke="#6E7679" stroke-width="1"></path>
      </g>
      <g class="enemy" id="enemyGroup">
        <ellipse cx="114" cy="66" rx="10" ry="3" fill="rgba(0,0,0,0.3)"></ellipse>
        <circle cx="114" cy="56" r="10" fill="#5A7D4B"></circle>
        <path d="M107 49 L110 44 L112 50 Z" fill="#5A7D4B"></path>
        <path d="M116 50 L120 44 L118 51 Z" fill="#5A7D4B"></path>
        <circle cx="111" cy="55" r="1.6" fill="#1A1A1A"></circle>
        <circle cx="117" cy="55" r="1.6" fill="#1A1A1A"></circle>
        <path d="M110 60 Q114 58 118 60" stroke="#1A1A1A" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
      </g>
    </svg>
    </div>
  </div>

  <div class="upnext">
    <div class="upnext-head"><span>Up next</span></div>
    <div class="upnext-list" id="upnextList"></div>
  </div>
</div>

<script>
// sample Sharon-area stops for the preview — swap for real optimized order later
const stops = [
  {name:"Kfar Saba — Herzl St 12", notes:"Gate code #4471", lat:32.1858, lng:34.9077, dist:"1.4 km", eta:"5 min"},
  {name:"Ra'anana — Ahuza St 60",  notes:"Ring bell twice",  lat:32.1847, lng:34.8709, dist:"3.1 km", eta:"9 min"},
  {name:"Hod HaSharon — Sokolov 8",notes:"",                 lat:32.1554, lng:34.8892, dist:"2.6 km", eta:"7 min"},
  {name:"Herzliya — Sderot Hen 21",notes:"Leave at door",     lat:32.1663, lng:34.8436, dist:"4.8 km", eta:"13 min"},
  {name:"Tel Mond — Ha'atzmaut 3", notes:"",                 lat:32.2503, lng:34.9709, dist:"6.2 km", eta:"16 min"},
  {name:"Kfar Saba — Weizmann 44", notes:"Call on arrival",   lat:32.1789, lng:34.9155, dist:"1.9 km", eta:"6 min"},
];

let i = 0;
const R = 44, CIRC = 2*Math.PI*R;
document.getElementById('ringFill').setAttribute('stroke-dasharray', CIRC.toFixed(1));

function render(){
  if(i >= stops.length){
    document.getElementById('stopCard').style.display='none';
    document.getElementById('doneScreen').style.display='flex';
    document.getElementById('upnextList').innerHTML='';
    document.getElementById('ringNum').textContent = stops.length;
    document.getElementById('ringSub').textContent = 'of '+stops.length;
    document.getElementById('mascotLevel').textContent = 'lv-'+stops.length;
    document.getElementById('mascotHpFill').style.width = '100%';
    const offset = 0;
    document.getElementById('ringFill').setAttribute('stroke-dashoffset', offset);
    return;
  }
  const s = stops[i];
  document.getElementById('ringNum').textContent = i+1;
  document.getElementById('ringSub').textContent = 'of '+stops.length;
  const progress = i / stops.length;
  document.getElementById('ringFill').setAttribute('stroke-dashoffset', (CIRC*(1-progress)).toFixed(1));

  document.getElementById('stopEyebrow').textContent = i===0 ? 'FIRST STOP' : 'NEXT STOP';
  document.getElementById('stopName').textContent = s.name;
  document.getElementById('stopNotes').textContent = s.notes;
  document.getElementById('chipDist').textContent = s.dist;
  document.getElementById('chipEta').textContent = s.eta;
  document.getElementById('mascotLevel').textContent = 'lv-'+(i+1);
  document.getElementById('mascotHpFill').style.width = Math.round((i/stops.length)*100)+'%';

  document.getElementById('navBtn').onclick = () => {
    window.open('https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'&travelmode=bicycling','_blank');
  };

  const upnext = stops.slice(i+1, i+4);
  document.getElementById('upnextList').innerHTML = upnext.map((u,idx)=>
    '<div class="upnext-item"><b>'+(i+2+idx)+'. '+u.name.split(' — ')[0]+'</b>'+(u.name.split(' — ')[1]||'')+'</div>'
  ).join('') || '<div class="upnext-item">Last stop</div>';
}

const happyLines = ["Nice one! 🎉", "Boom, delivered.", "One down, rolling on."];
const sadLines = ["Rough one — next!", "No answer, moving on.", "Shake it off, next stop."];

function spark(){
  const wrap = document.getElementById('mascotCharWrap');
  for(let k=0;k<6;k++){
    const s = document.createElement('span');
    s.className='spark';
    s.textContent = ['✨','🎉','⚡'][k%3];
    s.style.left = (36 + Math.random()*36)+'px';
    s.style.top = (10 + Math.random()*10)+'px';
    s.style.setProperty('--dx', ((Math.random()-0.5)*50)+'px');
    wrap.appendChild(s);
    setTimeout(()=>s.remove(), 750);
  }
}

function spawnDamage(){
  const wrap = document.getElementById('mascotCharWrap');
  const d = document.createElement('div');
  d.className='dmg-num';
  d.textContent = '69';
  d.style.left = '96px';
  d.style.top = '18px';
  wrap.appendChild(d);
  setTimeout(()=>d.remove(), 800);
}

function mascotReact(kind){
  const body = document.getElementById('mascotBody');
  const mouth = document.getElementById('mascotMouth');
  const msg = document.getElementById('mascotMsg');
  body.classList.remove('idle','happy','sad');
  void body.offsetWidth; // restart animation
  if(kind === 'happy'){
    body.classList.add('happy');
    mouth.setAttribute('d','M52 30 Q60 38 68 30');
    msg.textContent = happyLines[Math.floor(Math.random()*happyLines.length)];
    msg.className = 'mascot-msg show happy-text';
    spark();
    const scythe = document.getElementById('scytheGroup');
    const enemy = document.getElementById('enemyGroup');
    scythe.classList.remove('swing'); void scythe.offsetWidth; scythe.classList.add('swing');
    setTimeout(()=>{
      enemy.classList.remove('hit'); void enemy.offsetWidth; enemy.classList.add('hit');
      spawnDamage();
    }, 180);
  } else {
    body.classList.add('sad');
    mouth.setAttribute('d','M52 34 Q60 29 68 34');
    msg.textContent = sadLines[Math.floor(Math.random()*sadLines.length)];
    msg.className = 'mascot-msg show sad-text';
  }
  setTimeout(()=>{
    body.classList.remove('happy','sad');
    body.classList.add('idle');
    mouth.setAttribute('d','M53 31 Q60 35 67 31');
    msg.classList.remove('show');
  }, 1400);
}

document.getElementById('doneBtn').onclick = () => {
  mascotReact('happy');
  setTimeout(()=>{ i++; render(); }, 500);
};
document.getElementById('skipBtn').onclick = () => {
  mascotReact('sad');
  setTimeout(()=>{
    if(i < stops.length-1){
      const cur = stops.splice(i,1)[0];
      stops.push(cur);
      render();
    }
  }, 500);
};

function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
tickClock();
setInterval(tickClock, 1000);

render();
</script>
</body>
</html>
